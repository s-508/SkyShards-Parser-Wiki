name: Generate and Release Fusion Data

on:
  push:
    branches:
      - master
      - dev
    paths-ignore:
      - 'shard-hashes.json'
      - 'dist/**'

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Set release channel
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "TAG=alpha-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV
            echo "TARGET_BRANCH=dev" >> $GITHUB_ENV
            echo "PRERELEASE=true" >> $GITHUB_ENV
            echo "CHANNEL=Alpha" >> $GITHUB_ENV
          else
            echo "TAG=release-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_ENV
            echo "TARGET_BRANCH=master" >> $GITHUB_ENV
            echo "PRERELEASE=false" >> $GITHUB_ENV
            echo "CHANNEL=Release" >> $GITHUB_ENV
          fi

      - name: Run build-properties.py
        run: python build-properties.py

      - name: Run find-all-recipes.py
        run: python find-all-recipes.py

      - name: Run format-fusions.py
        run: python format-fusions.py

      - name: Check for changed shards
        id: shards_changed
        run: |
          if [ -s changed-shards.txt ]; then
            echo "changed=true" >> $GITHUB_OUTPUT
          else
            echo "changed=false" >> $GITHUB_OUTPUT
          fi

      - name: Push changed hashes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add shard-hashes.json dist/
          sed '1iUpdate shard hashes\n' changed-shards.txt | git commit -F - || echo "No changes to commit"
          git push origin HEAD:${{ github.ref_name }}

      - name: Create Release
        if: steps.shards_changed.outputs.changed == 'true'
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          name: Automated ${{ env.CHANNEL }} ${{ env.TAG }}
          body: 'Automated ${{ env.CHANNEL }} of fusion data and recipes from `${{ github.ref_name }}`.'
          draft: false
          prerelease: ${{ env.PRERELEASE }}
          files: |
            dist/fusion-data.json
            dist/fusion-properties.json
            dist/fusion-recipes.json

      - name: Update SkyShards fusion data
        if: steps.shards_changed.outputs.changed == 'true'
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ secrets.PAT }}
          repository: Campionnn/SkyShards
          event-type: update-fusion-data
          client-payload: |
            {
              "target_branch": "${{ env.TARGET_BRANCH }}",
              "release_tag": "${{ env.TAG }}"
            }
